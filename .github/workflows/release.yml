name: Release

on:
  push:
    tags:
      - 'v*'

# THIS IS THE FIX FOR THE 403 ERROR
permissions:
  contents: write

jobs:
  release:
    name: Release - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../codestat-${{ matrix.target }}.zip codestat.exe

      - name: Archive Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../codestat-${{ matrix.target }}.tar.gz codestat

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # This line now looks for BOTH types so it won't complain if one is missing
          files: |
            codestat-*.zip
            codestat-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
